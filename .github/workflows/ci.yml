# ==============================================================================
# ResumeMatch Continuous Integration (CI) Pipeline
# Validates backend test suite, frontend lint/build, and Docker container packaging.
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend CI (Python 3.11 + PostgreSQL 16 / pgvector service container)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Tests & Benchmark
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resumematch_user
          POSTGRES_PASSWORD: resumematch_password
          POSTGRES_DB: resumematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt

      - name: Run Database Migrations (Primary DB)
        run: |
          alembic upgrade head
        env:
          DATABASE_PROFILE: postgres_pgvector
          DATABASE_URL: postgresql+asyncpg://resumematch_user:resumematch_password@localhost:5432/resumematch
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: resumematch_user
          POSTGRES_PASSWORD: resumematch_password
          POSTGRES_DB: resumematch

      - name: Run Full Backend Pytest Suite
        run: |
          python -m pytest backend/tests -v
        env:
          DATABASE_PROFILE: postgres_pgvector
          DATABASE_URL: postgresql+asyncpg://resumematch_user:resumematch_password@localhost:5432/resumematch
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: resumematch_user
          POSTGRES_PASSWORD: resumematch_password
          POSTGRES_DB: resumematch
          POSTGRES_TEST_DB: resumematch_test
          SECRET_KEY: ci-stateless-test-jwt-signing-secret-key-32-chars!
          ENVIRONMENT: development
          PYTHONPATH: backend

      - name: Run AI/ML Evaluation Benchmark
        run: |
          python backend/app/evaluation/benchmark.py
        env:
          PYTHONPATH: backend

  # ----------------------------------------------------------------------------
  # Job 2: Frontend CI (Node.js 20 + TypeScript strict + ESLint + Turbopack build)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Type-Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle (Standalone Output)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          INTERNAL_API_BASE_URL: http://localhost:8000/api/v1

  # ----------------------------------------------------------------------------
  # Job 3: Docker CI (Validate Compose configuration and build images)
  # ----------------------------------------------------------------------------
  docker-ci:
    name: Docker Configuration & Image Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-stateless-test-jwt-signing-secret-key-32-chars!
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          INTERNAL_API_BASE_URL: http://backend:8000/api/v1

      - name: Build Backend and Frontend Images
        run: docker compose build
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-stateless-test-jwt-signing-secret-key-32-chars!
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          INTERNAL_API_BASE_URL: http://backend:8000/api/v1

  # ----------------------------------------------------------------------------
  # Job 4: E2E Playwright CI (End-to-end browser journeys against live stack)
  # ----------------------------------------------------------------------------
  e2e-playwright:
    name: End-to-End Browser Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resumematch_user
          POSTGRES_PASSWORD: resumematch_password
          POSTGRES_DB: resumematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt

      - name: Run Database Migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_PROFILE: postgres_pgvector
          DATABASE_URL: postgresql+asyncpg://resumematch_user:resumematch_password@localhost:5432/resumematch
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: resumematch_user
          POSTGRES_PASSWORD: resumematch_password
          POSTGRES_DB: resumematch

      - name: Start FastAPI Backend Service
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        env:
          DATABASE_PROFILE: postgres_pgvector
          DATABASE_URL: postgresql+asyncpg://resumematch_user:resumematch_password@localhost:5432/resumematch
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: resumematch_user
          POSTGRES_PASSWORD: resumematch_password
          POSTGRES_DB: resumematch
          SECRET_KEY: ci-stateless-test-jwt-signing-secret-key-32-chars!
          ENVIRONMENT: development
          PYTHONPATH: backend

      - name: Wait for Backend Health Check
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build Next.js Production Bundle
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          INTERNAL_API_BASE_URL: http://localhost:8000/api/v1

      - name: Start Next.js Frontend Server
        run: |
          npm run start &
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: 3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          INTERNAL_API_BASE_URL: http://localhost:8000/api/v1

      - name: Wait for Frontend Health Check
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:3000/; do sleep 1; done'

      - name: Execute Playwright E2E Suite
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "1"

      - name: Upload Playwright Failure Report & Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

